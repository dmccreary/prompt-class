<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>PowerShell vs. WSL Comparison Infographic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <h1 id="title">PowerShell vs. WSL</h1>
            <p class="subtitle" id="subtitle">Which shell should drive your AI agent's daily automation on Windows?</p>

            <div class="table-wrapper">
                <table class="compare-table" id="compare-table">
                    <thead>
                        <tr id="header-row">
                            <th class="factor-header">Factor</th>
                            <!-- Column headers with logos are generated by script.js -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows generated by script.js -->
                    </tbody>
                </table>
            </div>

            <p class="instructions">Hover (or tap) any highlighted cell for a detailed example.</p>
            <p class="source" id="source"></p>
        </div>

        <div class="infobox" id="infobox" role="tooltip">
            <button class="infobox-close" id="infobox-close" aria-label="Close">&times;</button>
            <div class="infobox-heading" id="infobox-heading"></div>
            <div class="infobox-detail" id="infobox-detail"></div>
            <pre class="infobox-example" id="infobox-example" hidden><code id="infobox-code"></code></pre>
        </div>
    </main>

    <script src="powershell-vs-wsl-comparison.js"></script>
</body>
</html>
